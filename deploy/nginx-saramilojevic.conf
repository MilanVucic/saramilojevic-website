server {
    listen 80;
    listen [::]:80;
    server_name saramilojevic.com www.saramilojevic.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saramilojevic.com www.saramilojevic.com;
    ssl_certificate /etc/nginx/migrated-certs/saramilojevic.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/migrated-certs/saramilojevic.com/privkey.pem;

    root /var/www/saramilojevic;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
}
